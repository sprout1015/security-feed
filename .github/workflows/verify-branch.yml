name: verify-branch

# 대상 저장소의 특정 ref를 받아 Gradle 컴파일 + lock 생성 + osv-scanner 대조를 수행하는 수동 검증 워크플로.
# 예) 의존성 업그레이드 브랜치와 main의 권고 수를 비교할 때 사용한다. 공개 로그이므로 비밀값을 출력하지 않는다.

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "대상 저장소 (owner/name)"
        required: true
      ref:
        description: "브랜치·태그·커밋"
        required: true
        default: main
      gradle_dirs:
        description: "Gradle 프로젝트 폴더 (공백 구분, 비우면 생략)"
        required: false
        default: ""
      lockfiles:
        description: "추가로 대조할 lock 파일 경로 (공백 구분)"
        required: false
        default: ""
      maven_metadata:
        description: "최신 버전 확인용 Maven 좌표 group:artifact (공백 구분, 선택)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IN_REPO: ${{ inputs.repo }}
      IN_REF: ${{ inputs.ref }}
      IN_GRADLE_DIRS: ${{ inputs.gradle_dirs }}
      IN_LOCKFILES: ${{ inputs.lockfiles }}
      IN_MAVEN_METADATA: ${{ inputs.maven_metadata }}
    steps:
      - name: Checkout security-feed
        uses: actions/checkout@v4
        with:
          path: feed

      - name: Checkout target
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Maven 최신 버전 (선택)
        if: ${{ inputs.maven_metadata != '' }}
        run: |
          {
            echo "## Maven 최신 버전"
            for coord in $IN_MAVEN_METADATA; do
              g="${coord%%:*}"; a="${coord##*:}"
              url="https://repo.maven.apache.org/maven2/${g//.//}/${a}/maven-metadata.xml"
              vers=$(curl -fsSL "$url" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -15 | tr '\n' ' ')
              echo "- \`$coord\`: $vers"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gradle 컴파일 + lock 생성
        run: |
          set +e -u
          status=0
          echo "## Gradle" >> "$GITHUB_STEP_SUMMARY"
          echo "대상: \`$IN_REPO@$IN_REF\` ($(git -C target rev-parse --short HEAD))" >> "$GITHUB_STEP_SUMMARY"
          for d in $IN_GRADLE_DIRS; do
            echo "::group::build $d"
            ( cd "target/$d" && chmod +x gradlew && ./gradlew --no-daemon build -x test )
            b=$?
            echo "::endgroup::"
            echo "::group::lock $d"
            ( cd "target/$d" && ./gradlew --no-daemon --init-script "$GITHUB_WORKSPACE/feed/collector/lock-all.init.gradle" dependencies --write-locks > /dev/null )
            l=$?
            echo "::endgroup::"
            echo "- \`$d\`: build $([ $b -eq 0 ] && echo 성공 || echo 실패) · lock $([ $l -eq 0 ] && echo 성공 || echo 실패)" >> "$GITHUB_STEP_SUMMARY"
            [ $b -ne 0 ] || [ $l -ne 0 ] && status=1
          done
          echo "GRADLE_STATUS=$status" >> "$GITHUB_ENV"

      - name: Install osv-scanner
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$HOME/bin/osv-scanner"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: osv-scanner 대조
        run: |
          set -u
          mkdir -p scan
          files="$IN_LOCKFILES"
          for d in $IN_GRADLE_DIRS; do files="$files $d/gradle.lockfile"; done
          for f in $files; do
            if [ -f "target/$f" ]; then
              mkdir -p "scan/$(dirname "$f")"; cp "target/$f" "scan/$f"
            else
              echo "::warning::lock 파일 없음: $f"
            fi
          done
          osv-scanner scan source --recursive --no-ignore --format json scan > osv.json || true
          curl -fsSL https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json -o kev.json || echo '{"vulnerabilities":[]}' > kev.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          osv = json.load(open("osv.json"))
          kev = {v["cveID"] for v in json.load(open("kev.json")).get("vulnerabilities", [])}
          rows, total_pkgs, total_adv = [], 0, 0
          kev_hits = []
          for res in osv.get("results", []):
              src = res.get("source", {}).get("path", "").split("/scan/", 1)[-1]
              for p in res.get("packages", []):
                  total_pkgs += 1
                  pk = p["package"]
                  groups = p.get("groups", [])
                  total_adv += len(groups)
                  scores = [float(g["max_severity"]) for g in groups if g.get("max_severity")]
                  ids = set()
                  for v in p.get("vulnerabilities", []):
                      ids.add(v["id"]); ids.update(v.get("aliases", []))
                  for c in sorted(ids & kev):
                      kev_hits.append(f"{pk['name']} {pk['version']} ({c})")
                  if scores and max(scores) >= 7.0:
                      rows.append((max(scores), pk["name"], pk["version"], len(groups), src))
          print("## osv-scanner 요약")
          print(f"- 취약 패키지 {total_pkgs}개 · 권고(그룹) {total_adv}건 · CVSS 7.0 이상 패키지 {len(rows)}개")
          print(f"- KEV 등재 CVE: {', '.join(kev_hits) if kev_hits else '없음'}")
          print()
          print("| 최고 CVSS | 패키지 | 버전 | 권고 | lock |")
          print("|---|---|---|---|---|")
          for s, n, v, c, src in sorted(rows, reverse=True):
              print(f"| {s} | {n} | {v} | {c} | {src} |")
          PY

      - name: 결과 업로드
        uses: actions/upload-artifact@v4
        with:
          name: verify-result
          path: |
            osv.json
            scan/
          retention-days: 7

      - name: Gradle 결과 판정
        run: |
          if [ "${GRADLE_STATUS:-0}" != "0" ]; then
            echo "::error::Gradle 빌드 또는 lock 생성 실패"
            exit 1
          fi
