name: notify-discord

# 데일리 루틴(Claude)이 Notion 보고서를 다 쓴 뒤 repository_dispatch(report-ready)로 호출한다.
# 루틴 환경에서는 discord.com에 직접 나갈 수 없어 GitHub Actions가 대신 보낸다.
# 봇 토큰·채널 ID는 저장소 Secrets(DISCORD_BOT_TOKEN, DISCORD_CHANNEL_ID)에만 둔다.
# 이 저장소는 공개라 Actions 로그도 공개된다: 토큰·응답 본문을 출력하지 않는다.
on:
  repository_dispatch:
    types: [report-ready]
  workflow_dispatch:
    inputs:
      verdict: { description: "판정 (예: 🔴 L1 있음)", required: true, default: "🧪 테스트" }
      date: { description: "보고 날짜 YYYY-MM-DD", required: false }
      l1: { required: false, default: "0" }
      l2: { required: false, default: "0" }
      l3: { required: false, default: "0" }
      l4: { required: false, default: "0" }
      summary: { description: "한 줄 요약", required: false, default: "알림 연결 테스트" }
      url: { description: "Notion 보고서 링크", required: false, default: "" }
      actions: { description: "할 일 (줄바꿈 또는 | 로 구분, 최대 3개)", required: false, default: "" }
      top: { description: "L1 상위 항목 (줄바꿈 또는 | 로 구분, 최대 3개)", required: false, default: "" }
      checks: { description: "사람 확인 요청 건수", required: false, default: "0" }
      channel_id: { description: "(진단용) Secret 대신 쓸 채널 ID", required: false, default: "" }

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Discord message
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          PAYLOAD_JSON: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload) || toJSON(github.event.inputs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error, datetime as dt

          import re
          token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
          if token.lower().startswith("bot "):
              token = token[4:].strip()
          p0 = json.loads(os.environ.get("PAYLOAD_JSON") or "{}") or {}
          raw_channel = (p0.get("channel_id") or "").strip() or os.environ.get("DISCORD_CHANNEL_ID", "")
          channel = re.sub(r"\D", "", raw_channel)  # 공백·줄바꿈·<#…> 표기 제거, 숫자만
          if not token or not channel:
              print("::error::DISCORD_BOT_TOKEN / DISCORD_CHANNEL_ID 저장소 Secret이 없습니다.")
              sys.exit(1)

          p = json.loads(os.environ.get("PAYLOAD_JSON") or "{}") or {}
          # repository_dispatch 는 client_payload 최상위 항목이 10개까지라 건수는 counts 로 묶어 받는다
          if isinstance(p.get("counts"), dict):
              for k, v in p["counts"].items():
                  p.setdefault(k, v)
          def s(k, d="", n=300):
              return str(p.get(k) if p.get(k) not in (None, "") else d)[:n]

          kst = dt.timezone(dt.timedelta(hours=9))
          date = s("date", dt.datetime.now(kst).date().isoformat(), 10)
          verdict = s("verdict", "보고서 작성 완료", 40)
          mark = verdict[:1]
          head, color = {
              "🔴": ("오늘 조치 필요", 0xE5484D),
              "🟠": ("이번 주 안에 조치", 0xF5A524),
              "🟢": ("조치 필요 없음", 0x30A46C),
              "⚪": ("수집 실패 — 확인 필요", 0x8B8D98),
          }.get(mark, ("알림", 0x5B5BD6))
          url = s("url", "", 500)
          if url and not url.startswith(("https://www.notion.so/", "https://app.notion.com/", "https://notion.so/")):
              url = ""  # Notion 주소만 링크로 허용

          def lst(k, n=3, w=140):
              v = p.get(k)
              if isinstance(v, str):
                  v = [x for x in v.replace("|", "\n").split("\n")]
              return [str(x).strip()[:w] for x in (v or []) if str(x).strip()][:n]

          actions = lst("actions")
          if not actions:
              actions = {"🔴": ["보고서의 🔴 L1 표를 열어 패치 버전으로 업데이트"],
                         "🟠": ["보고서의 🟠 L2 표를 보고 이번 주 일정에 업데이트 반영"],
                         "🟢": ["할 일 없음 — 요약만 확인"],
                         "⚪": ["GitHub Actions의 collect-security-feed 실행 결과 확인"]}.get(mark, ["보고서 확인"])
          top = lst("top")
          try:
              checks = int(s("checks", "0", 4))
          except ValueError:
              checks = 0

          desc = [f"**{s('summary', '', 200)}**", ""] if s("summary") else []
          desc += ["**📌 할 일**"] + [f"{i}. {a}" for i, a in enumerate(actions, 1)]
          if checks:
              desc += [f"🙋 사람 확인 요청 **{checks}건** — 보고서의 🙋 체크리스트"]
          if url:
              desc += ["", f"[📄 보고서 열기]({url})"]

          fields = []
          if top:
              fields.append({"name": "🔴 긴급 항목", "value": "\n".join(f"• {t}" for t in top)[:1000], "inline": False})
          fields.append({"name": "건수", "value": f"🔴 {s('l1','0',6)}  ·  🟠 {s('l2','0',6)}  ·  🟡 {s('l3','0',6)}  ·  ⚪ {s('l4','0',6)}", "inline": False})

          embed = {
              "title": f"{mark} {head}  |  보안 일일 보고 {date[5:].replace('-', '/')}",
              "description": "\n".join(desc)[:3500],
              "color": color,
              "fields": fields,
              "footer": {"text": "🔴 오늘 · 🟠 이번 주 · 🟡 관찰 · ⚪ 참고  |  security-feed"},
          }
          if url:
              embed["url"] = url
          body = {"embeds": [embed], "allowed_mentions": {"parse": []}}

          req = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{channel}/messages",
              data=json.dumps(body).encode(),
              headers={"Authorization": f"Bot {token}", "Content-Type": "application/json",
                       "User-Agent": "security-feed-notify (https://github.com/sprout1015/security-feed, 1.0)"},
              method="POST")
          def diag():
              # 공개 로그이므로 값은 출력하지 않고 길이·개수만 출력
              print(f"진단: 채널 ID 숫자 {len(channel)}자리 (원본 {len(raw_channel)}자), 토큰 {len(token)}자")
              def get(path):
                  rq = urllib.request.Request(f"https://discord.com/api/v10{path}",
                      headers={"Authorization": f"Bot {token}", "User-Agent": "security-feed-notify (https://github.com/sprout1015/security-feed, 1.0)"})
                  with urllib.request.urlopen(rq, timeout=20) as r:
                      return json.load(r)
              try:
                  me = get("/users/@me"); print(f"진단: 토큰 정상 (봇 계정 확인됨, bot={me.get('bot')})")
              except urllib.error.HTTPError as e2:
                  print(f"진단: 토큰 확인 실패 HTTP {e2.code}"); return
              try:
                  print(f"진단: 봇이 들어가 있는 서버 {len(get('/users/@me/guilds'))}개")
              except urllib.error.HTTPError as e2:
                  print(f"진단: 서버 목록 조회 실패 HTTP {e2.code}")
              try:
                  ch = get(f"/channels/{channel}"); print(f"진단: 채널 조회 성공 (type={ch.get('type')})")
              except urllib.error.HTTPError as e2:
                  print(f"진단: 채널 조회 실패 HTTP {e2.code} — 이 ID의 채널을 봇이 볼 수 없음")
              try:
                  get(f"/guilds/{channel}")
                  print("진단: 이 ID는 채널이 아니라 서버(길드) ID입니다. 채널 이름 우클릭 → '채널 ID 복사' 값을 쓰세요.")
              except urllib.error.HTTPError:
                  pass

          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print(f"Discord 전송 완료 (HTTP {r.status})")
          except urllib.error.HTTPError as e:
              diag()
              hint = {401: "토큰이 잘못됨", 403: "봇에 채널 보기/메시지 보내기/임베드 링크 권한이 없음",
                      404: "채널 ID가 잘못됐거나 봇이 그 서버에 없음"}.get(e.code, "")
              print(f"::error::Discord 전송 실패 HTTP {e.code} {hint}")
              sys.exit(1)
          PY
