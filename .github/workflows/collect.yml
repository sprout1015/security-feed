name: collect-security-feed

on:
  schedule:
    # GitHub 예약 실행은 실제로 4~8시간 늦거나(11/21~24 기록: 10:27~14:23 KST 시작) 빠질 수 있다.
    # 실측: 예약 실행이 약 8시간 늦게 돈다(11/26 새벽용 4회가 09:15~12:00 KST에 실행). 주 경로는 Claude 예약 작업(05:47 KST)이 보내는 repository_dispatch(collect).
    # 아래 예약은 보조 경로이며, 이미 오늘 결과가 있으면 건너뛴다.
    - cron: "13 16 * * *"   # 01:13 KST
    - cron: "43 17 * * *"   # 02:43 KST
    - cron: "17 19 * * *"   # 04:17 KST
    - cron: "37 20 * * *"   # 05:37 KST (마지막 기회)
  workflow_dispatch: {}
  repository_dispatch:
    types: [collect]   # Claude 예약 작업(05:47)·루틴이 보내는 수집 시작 신호. 루틴 토큰은 workflow_dispatch 권한이 없다(11/27)

permissions:
  contents: write   # runs/·state/ 결과 커밋에만 필요 (다른 권한 없음)

concurrency:
  group: collect-security-feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's run already exists
        id: guard
        run: |
          D=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "runs/$D/status.json" ]; then
            echo "오늘($D) 결과가 이미 있어 예약 실행을 건너뜀"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Install osv-scanner
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/osv-scanner" https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          chmod +x "$HOME/bin/osv-scanner"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Collect
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector/run.py

      - name: Commit results
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "security-feed-bot"
          git config user.email "security-feed-bot@users.noreply.github.com"
          git add state runs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "collect: $(TZ=Asia/Seoul date +%F)"
            # 실행 중 main에 다른 커밋이 올라오면(11/26) 바로 push가 거부된다. 결과(state/runs)만 바뀌므로 rebase 후 재시도.
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
